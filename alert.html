<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>雪哨</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --win-bg:#FFFFFF; --win-border:#E5E6EB;
      --hd-border:#EDEDED;
      --title:#1D2129; --subtitle:#86909C;
      --logo-color:#4F8A6B;
      --btn-p-color:#4F8A6B; --btn-p-border:#4F8A6B;
      --btn-g-color:#86909C; --btn-g-border:#E5E6EB;
      --card-bg:#F7F8FA; --card-border:#E5E6EB;
      --name:#1D2129; --summary:#4E5969;
      --badge:#4F8A6B;
      --footer:#86909C; --footer-border:#EDEDED;
      --divider:#EDEDED;
      --hint-bg:#EAF1ED;
      --avatar-size:36px;
    }
    body.theme-dark {
      --win-bg:#23262E; --win-border:#2E333D;
      --hd-border:#2E333D;
      --title:#F2F3F5; --subtitle:#86909C;
      --logo-color:#4F8A6B;
      --btn-p-color:#4F8A6B; --btn-p-border:#2E333D;
      --btn-g-color:#86909C; --btn-g-border:#2E333D;
      --card-bg:#2A2F38; --card-border:#2E333D;
      --name:#F2F3F5; --summary:#C9CDD4;
      --badge:#4F8A6B;
      --footer:#86909C; --footer-border:#2E333D;
      --divider:#2E333D;
      --hint-bg:#1F2A25;
    }
    body.layout-inbox { --avatar-size:32px; }

    html, body {
      font-family: -apple-system, "Microsoft YaHei", "PingFang SC", sans-serif;
      background: var(--win-bg);
      color: var(--title);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    body { animation: fadeIn .3s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }

    /* ── 顶部标题栏（全部靠左：人数 + 按钮一行排开）── */
    .hd {
      background: var(--win-bg);
      color: var(--title);
      padding: 10px 14px 10px 25px;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
      flex-wrap: nowrap;
      border-bottom: 0.5px solid var(--hd-border);
    }
    .hd .total {
      font-size: 12px; font-weight: 500; color: var(--subtitle);
      white-space: nowrap; flex-shrink: 0;
    }
    .hd button {
      background: transparent;
      border: 0.5px solid var(--btn-p-border);
      color: var(--btn-p-color);
      border-radius: 14px;
      padding: 3px 10px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 500;
      transition: opacity .15s;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .hd button.btn-g { border-color: var(--btn-g-border); color: var(--btn-g-color); padding: 3px 12px; }
    .hd button:hover { opacity: .7; }
    /* 头部右侧弹性占位：把已读全部/关闭/主题切换推到最右 */
    .hd-spacer { flex: 1 1 auto; }
    /* 明亮/黑暗分段按钮：紧贴关闭按钮右侧，靠右对齐 */
    .hd .theme-toggle { display: inline-flex; border: 0.5px solid var(--btn-g-border); border-radius: 14px; overflow: hidden; flex-shrink: 0; margin-left: 2px; }
    .hd .theme-toggle .theme-btn { border: none; border-radius: 0; padding: 3px 10px; background: transparent; color: var(--subtitle); font-size: 11px; font-weight: 500; cursor: pointer; }
    .hd .theme-toggle .theme-btn + .theme-btn { border-left: 0.5px solid var(--btn-g-border); }   /* 中间分隔线（文档 §4.3） */
    .hd .theme-toggle .theme-btn.active { background: var(--hint-bg); color: var(--btn-p-color); font-weight: 600; }
    .hd .theme-toggle .theme-btn:hover { opacity: .85; }
    .theme-ico { vertical-align: -2px; margin-right: 3px; }

    /* ── 消息列表 ── */
    .list {
      flex: 1;
      overflow-y: hidden;
      padding: 14px;
      background: transparent;
      scrollbar-width: thin;
      scrollbar-color: rgba(128,128,128,.25) transparent;
    }
    body.layout-inbox .list { padding: 4px 14px; }
    .list::-webkit-scrollbar { width: 4px; }
    .list::-webkit-scrollbar-thumb { background: rgba(128,128,128,.25); border-radius: 2px; }

    /* ── 行（卡片 / 收件箱行 共用）── */
    .row {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      cursor: pointer;
      transition: opacity .3s, transform .3s, max-height .3s, margin .3s, padding .3s, border-width .3s, background .15s;
    }
    body:not(.layout-inbox) .row {
      background: var(--card-bg);
      border: 0.5px solid var(--card-border);
      border-radius: 10px;
      padding: 11px;
      margin-bottom: 10px;
      overflow: hidden;
    }
    body:not(.layout-inbox) .row:hover { border-color: #A8C7B5; }
    body.layout-inbox .row { padding: 11px 0; border-bottom: 0.5px solid var(--divider); }
    body.layout-inbox .row:last-child { border-bottom: none; }
    body.layout-inbox .row:hover { background: rgba(128,128,128,.05); }

    .row.read {
      opacity: 0;
      transform: translateX(60px);
      max-height: 0;
      margin-bottom: 0;
      padding-top: 0;
      padding-bottom: 0;
      border-width: 0;
      pointer-events: none;
    }

    /* ── 头像：圆角方块 + 马卡龙低饱和色 ── */
    .avatar {
      width: var(--avatar-size); height: var(--avatar-size);
      border-radius: 9px;
      color: #fff; display: flex; align-items: center; justify-content: center;
      font-size: 15px; font-weight: 500; flex-shrink: 0;
    }
    body.layout-inbox .avatar { border-radius: 8px; }
    /* 暗色下头像底色压暗（设计稿用深蓝/深绿/深粉；JS 生成的马卡龙色用 filter 统一压暗避免刺眼） */
    body.theme-dark .avatar { filter: brightness(0.82) saturate(0.9); }

    /* ── 内容区 ── */
    .body { flex: 1; min-width: 0; }
    .row1 { display: flex; align-items: center; gap: 8px; }
    .name { flex: 1; min-width: 0; font-size: 13px; font-weight: 500; color: var(--name); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .badge {
      flex-shrink: 0; min-width: 18px; height: 18px; padding: 0 6px;
      background: var(--badge); color: #fff; border-radius: 10px;
      font-size: 11px; font-weight: 500; line-height: 18px; text-align: center;
    }
    .summary { font-size: 12px; font-weight: 400; color: var(--summary); line-height: 1.5; margin-top: 4px; word-break: break-word; overflow-wrap: break-word; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    body.layout-inbox .summary { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* ── 空态 ── */
    .empty {
      color: var(--badge); font-size: 13px; text-align: center; padding: 40px 16px;
      flex: 1; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 6px;
    }
    /* 覆盖 alert.js L180 硬编码的 color:#1E6FFF（"已全部标记为已读" 蓝色残留 → 品牌绿） */
    .empty { color: var(--badge) !important; }

    /* ── 底部提示栏（左对齐）── */
    .ft {
      font-size: 11px; font-weight: 400; color: var(--footer); text-align: left; padding: 10px 14px 10px 25px;
      flex-shrink: 0; background: transparent; line-height: 1.5; border-top: 0.5px solid var(--footer-border);
    }

    /* ── 折叠行：与底部说明文字同左对齐线（25px = 列表14px + 自身11px）── */
    .fold {
      font-size: 11px; font-weight: 500; color: var(--btn-p-color);
      padding: 10px 0 10px 11px; cursor: pointer; user-select: none;
      transition: opacity .15s; margin-top: 2px;
    }
    .fold:hover { opacity: .7; }
  </style>
</head>
<body>
  <div class="hd">
    <span class="total" id="total"></span>
    <span class="hd-spacer"></span>
    <button id="markAll">已读全部</button>
    <button id="close" class="btn-g">关闭</button>
    <span class="theme-toggle">
      <button id="themeLight" class="theme-btn"><svg class="theme-ico" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><circle cx="8" cy="8" r="2.6" fill="none" stroke="currentColor" stroke-width="1.4"/><g stroke="currentColor" stroke-width="1.4" stroke-linecap="round" fill="none"><path d="M8 1.2v1.8"/><path d="M8 13v1.8"/><path d="M1.2 8h1.8"/><path d="M13 8h1.8"/><path d="M3.05 3.05l1.27 1.27"/><path d="M11.68 11.68l1.27 1.27"/><path d="M3.05 12.95l1.27-1.27"/><path d="M11.68 4.32l1.27-1.27"/></g></svg>明亮</button>
      <button id="themeDark" class="theme-btn"><svg class="theme-ico" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M12.8 9.4A5.2 5.2 0 0 1 6.6 3.2a5.2 5.2 0 1 0 6.2 6.2z" fill="currentColor"/></svg>黑暗</button>
    </span>
  </div>
  <div class="list" id="list"></div>
  <div class="ft">点击卡片打开并标记已读 · 3分钟未操作自动关闭</div>
  <script src="alert.js"></script>
</body>
</html>
