<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>雪哨</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 420px;
      height: 100vh;
      overflow: hidden;
      font-family: -apple-system, "Microsoft YaHei", "PingFang SC", sans-serif;
      background: #F8F9FA;
      display: flex;
      flex-direction: column;
    }
    body { animation: fadeIn .3s ease-out; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── 顶部标题栏：浅色毛玻璃风格 ── */
    .hd {
      background: rgba(255,255,255,.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #1D2129;
      padding: 11px 16px;
      font-size: 13px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      border-bottom: 0.5px solid #EDEEF0;
    }
    .hd-left { display: flex; align-items: center; gap: 7px; }
    .hd-icon { font-size: 15px; }
    .hd-title { font-weight: 600; font-size: 14px; color: #1D2129; }
    .hd .total { font-size: 12px; color: #86909C; margin-left: 4px; }
    .hd-right { display: flex; gap: 8px; align-items: center; }
    .hd button {
      background: transparent;
      border: 1px solid #C9CDD4;
      color: #4E5969;
      border-radius: 6px;
      padding: 4px 12px;
      cursor: pointer;
      font-size: 12px;
      transition: all .15s;
    }
    .hd button:hover { border-color: #1E6FFF; color: #1E6FFF; background: rgba(30,111,255,.04); }

    /* ── 消息列表 ── */
    .list {
      flex: 1;
      overflow-y: auto;
      padding: 12px 14px;
      background: transparent;
      scrollbar-width: thin;
      scrollbar-color: rgba(0,0,0,.10) transparent;
    }
    .list::-webkit-scrollbar { width: 4px; }
    .list::-webkit-scrollbar-thumb { background: rgba(0,0,0,.10); border-radius: 2px; }

    /* ── 卡片：微阴影 + 淡边框 + 圆角 ── */
    .card {
      background: #fff;
      border: 1px solid #EFEFEF;
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: box-shadow .15s, transform .12s, border-color .15s, opacity .3s, max-height .3s, margin .3s, padding .3s;
      position: relative;
      display: flex;
      gap: 12px;
      align-items: flex-start;
      max-height: 130px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,.04);
    }
    .card:hover {
      box-shadow: 0 4px 16px rgba(0,0,0,.08);
      transform: translateY(-1px);
      border-color: #D6E4FF;
    }
    /* 已读滑出 */
    .card.read {
      opacity: 0;
      transform: translateX(60px);
      max-height: 0;
      margin-bottom: 0;
      padding-top: 0;
      padding-bottom: 0;
      border-width: 0;
      pointer-events: none;
    }

    /* ── 头像：马卡龙色系（低饱和、柔和） ── */
    .avatar {
      width: 42px; height: 42px; border-radius: 50%;
      color: #fff; display: flex; align-items: center; justify-content: center;
      font-size: 17px; font-weight: 500; flex-shrink: 0; position: relative;
    }
    /* 角标：红色小圆点/数字，压在右上角 */
    .badge {
      position: absolute; top: -5px; right: -5px;
      min-width: 18px; height: 18px; padding: 0 5px;
      background: #F53F3F; color: #fff; border-radius: 9px;
      font-size: 11px; font-weight: 600; line-height: 18px; text-align: center;
      border: 2px solid #F8F9FA; box-shadow: 0 1px 4px rgba(245,63,63,.25);
    }

    /* ── 卡片内容区 ── */
    .body { flex: 1; min-width: 0; }
    .row1 { display: flex; align-items: baseline; gap: 8px; margin-bottom: 5px; }
    .name { font-size: 14px; font-weight: 600; color: #1D2129; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .time { font-size: 11px; color: #86909C; flex-shrink: 0; margin-left: auto; }
    .txt { font-size: 12px; color: #4E5969; line-height: 1.55; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; word-break: break-word; }
    .readhint { font-size: 11px; color: #1E6FFF; margin-top: 5px; opacity: 0; transition: opacity .15s; }
    .card:hover .readhint { opacity: 1; }

    /* ── 空态 ── */
    .empty {
      color: #86909C; font-size: 13px; text-align: center; padding: 40px 16px;
      flex: 1; display: flex; align-items: center; justify-content: center;
    }

    /* ── 底部提示栏：缩小、居中、淡色 ── */
    .ft {
      font-size: 11px; color: #86909C; text-align: center; padding: 8px 0 10px;
      flex-shrink: 0; background: transparent; line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="hd">
    <div class="hd-left">
      <span class="hd-icon">❄</span>
      <span class="hd-title">雪哨</span>
      <span class="total" id="total"></span>
    </div>
    <div class="hd-right">
      <button id="markAll">一键已读</button>
      <button id="close">关闭</button>
    </div>
  </div>
  <div class="list" id="list"></div>
  <div class="ft">点击卡片打开并标记已读 · 全部读完自动关闭 · 3分钟未操作自动关闭</div>
  <script src="alert.js"></script>
</body>
</html>
